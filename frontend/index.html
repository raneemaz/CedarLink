<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CedarLink</title>
    <script>
      // Orient the first paint before React loads, so a hard reload in
      // Arabic never flashes left-to-right. i18n.js is the source of truth
      // and persists the choice; this only mirrors it.
      (function () {
        try {
          var lang = localStorage.getItem("cedarlink_language");
          if (!lang) {
            var nav = navigator.languages || [navigator.language || "en"];
            lang = String(nav[0] || "en").toLowerCase().slice(0, 2);
          }
          if (["en", "ar", "fr"].indexOf(lang) < 0) lang = "en";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {
          /* storage blocked — default LTR stands */
        }

        // Same trick for the theme. Without this a dark-theme user gets a
        // full white frame before React mounts, which is the one thing a
        // dark theme is supposed to prevent. "system" deliberately sets
        // no attribute, so the prefers-color-scheme block in index.css
        // decides and keeps deciding.
        try {
          // The cache is namespaced by user id, so a shared browser
          // cannot paint the previous account's theme. Signed out, the
          // key is bare. Must stay in step with themeCacheKey() in
          // utils/theme.js — a test asserts it does.
          var key = "cedarlink_theme";
          var stored = localStorage.getItem("user");
          if (stored) {
            var id = JSON.parse(stored).id;
            if (id !== null && id !== undefined) key += ":" + id;
          }
          var theme = localStorage.getItem(key);
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          } else {
            document.documentElement.removeAttribute("data-theme");
          }
        } catch (e) {
          /* storage blocked — the system preference stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
