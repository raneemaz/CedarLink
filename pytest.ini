[pytest]
testpaths = tests
# Put the repo root on sys.path so `import app` works when the suite is run
# as the bare `pytest` console script (not just `python -m pytest`, which
# adds the CWD itself). CI runs `pytest`.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
